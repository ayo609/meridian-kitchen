<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Raffia Palm</title>
<meta name="description" content="Browse the full Raffia Palm menu, add dishes to your cart and place your order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171012; --bg-2:#1D1416;
    --coral:#FF6B4A; --amber:#FFB648; --berry:#FF3D77;
    --glass:rgba(255,255,255,0.06); --glass-strong:rgba(255,255,255,0.12); --glass-border:rgba(255,255,255,0.14);
    --text:#FFF6EE; --muted:#C9B8AE; --star:#FFC94D;
    --ok:#7CE0A0; --error:#FF6B6B;
    --radius:12px; --ease:cubic-bezier(.22,.9,.25,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ color-scheme:dark; scroll-behavior:smooth; }
  body{ background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; overflow-x:hidden; padding-bottom:78px; }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; letter-spacing:-0.01em; }
  a{color:inherit; text-decoration:none;}
  button, input, textarea{font-family:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  .blobs{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:0.22; }
  .blob.b1{ width:480px; height:480px; background:var(--coral); top:-140px; left:-100px; }
  .blob.b2{ width:420px; height:420px; background:var(--amber); bottom:-160px; right:-140px; }

  .toast-stack{ position:fixed; top:18px; left:18px; z-index:220; display:flex; flex-direction:column; gap:10px; }
  .toast{ background:rgba(23,16,18,0.95); border:1px solid var(--glass-border); border-left:3px solid var(--coral); color:var(--text); padding:13px 18px; border-radius:8px; font-size:0.85rem; font-weight:500; box-shadow:0 14px 30px -10px rgba(0,0,0,0.5); transform:translateX(-120%); transition:transform .35s var(--ease); max-width:280px; }
  .toast.show{ transform:translateX(0); }
  .toast.ok{ border-left-color:var(--ok); }
  .toast.err{ border-left-color:var(--error); }

  .classic-box{ position:relative; }
  .classic-box::before{ content:''; position:absolute; top:8px; left:8px; right:8px; bottom:8px; border:1px solid rgba(255,182,72,0.16); border-radius:7px; pointer-events:none; z-index:1; }

  /* ---------- Marquee ---------- */
  .marquee{ position:relative; z-index:20; background:linear-gradient(90deg, var(--coral), var(--berry)); color:#1a0e0a; overflow:hidden; white-space:nowrap; padding:8px 0; font-weight:600; font-size:0.78rem; letter-spacing:0.04em; }
  .marquee .track{ display:inline-block; animation: scroll-left 24s linear infinite; padding-left:100%; }
  .marquee span{ margin:0 26px; }
  @keyframes scroll-left{ from{transform:translateX(0);} to{transform:translateX(-100%);} }

  /* ---------- Header ---------- */
  header{ position:relative; z-index:2; display:flex; justify-content:center; padding:18px clamp(18px,4vw,48px) 6px; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; }
  .brand img{ width:36px; height:36px; border-radius:8px; object-fit:cover; }

  /* ---------- Stylish name/time card ---------- */
  .info-card-wrap{ position:relative; z-index:1; display:flex; justify-content:center; padding:10px clamp(18px,4vw,48px) 4px; }
  .info-card{
    display:flex; align-items:center; gap:18px; padding:12px 26px; border-radius:999px;
    background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(14px);
  }
  .info-card .seg{ display:flex; flex-direction:column; align-items:center; }
  .info-card .seg .label{ font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .info-card .seg .value{ font-family:'Fraunces',serif; font-weight:600; font-size:0.95rem; margin-top:2px; }
  .info-card .divider{ width:1px; height:28px; background:var(--glass-border); }

  /* ---------- Welcome banner (auto-hides) ---------- */
  .welcome-wrap{ position:relative; z-index:1; padding:22px clamp(18px,4vw,48px) 4px; text-align:center; transition: opacity .6s var(--ease), max-height .6s var(--ease); overflow:hidden; }
  .welcome-wrap.hide{ opacity:0; max-height:0; padding-top:0; padding-bottom:0; }
  .welcome-wrap h1{ font-size:clamp(1.4rem,3.2vw,1.9rem); margin-bottom:6px; }
  .welcome-wrap p{ color:var(--muted); font-size:0.88rem; font-weight:300; }

  /* ---------- Search ---------- */
  .search-wrap{ position:relative; z-index:1; padding:14px clamp(18px,4vw,48px) 6px; display:flex; justify-content:center; }
  .search-form{ display:flex; align-items:center; gap:10px; background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(14px); border-radius:10px; padding:7px 7px 7px 20px; max-width:560px; width:100%; }
  .search-form input{ flex:1; background:none; border:none; color:var(--text); font-size:0.94rem; }
  .search-form input::placeholder{ color:var(--muted); }
  .search-form input:focus{ outline:none; }
  .search-form button{ background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a; border:none; border-radius:8px; padding:10px 20px; font-weight:600; font-size:0.84rem; cursor:pointer; }

  /* ---------- Category tabs ---------- */
  .cat-scroll{ position:relative; z-index:1; display:flex; gap:12px; overflow-x:auto; padding:20px clamp(18px,4vw,48px); scrollbar-width:none; }
  .cat-scroll::-webkit-scrollbar{ display:none; }
  .cat-chip{ flex:0 0 auto; padding:10px 20px; border-radius:8px; background:var(--glass); border:1px solid var(--glass-border); font-size:0.85rem; font-weight:600; white-space:nowrap; color:var(--muted); cursor:pointer; transition: all .25s var(--ease); }
  .cat-chip:hover{ border-color:var(--amber); color:var(--text); }
  .cat-chip.active{ background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a; border-color:transparent; }

  /* ---------- Dish rows (horizontal scroll, grouped by category) ---------- */
  main{ position:relative; z-index:1; padding:6px clamp(18px,4vw,48px) 40px; }
  .cat-section{ margin-bottom:36px; }
  .cat-section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .cat-section-head h3{ font-size:1.05rem; font-weight:600; }
  .cat-section-head span{ font-size:0.76rem; color:var(--muted); }
  .dish-row-wrap{ position:relative; }
  .dish-row{ display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 4px 12px; scrollbar-width:none; }
  .dish-row::-webkit-scrollbar{ display:none; }

  .dish-card{
    scroll-snap-align:start; flex:0 0 auto; width:210px; position:relative;
    border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);
    padding:18px 16px 16px; cursor:pointer; transition: border-color .3s var(--ease), transform .3s var(--ease);
    opacity:0; translate:0 14px; border-top:3px solid var(--amber);
  }
  .dish-card.in-view{ animation: rise .6s var(--ease) forwards; }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .dish-card:hover{ border-color:var(--amber); transform:translateY(-4px); }
  .avail-badge{ position:absolute; top:14px; right:14px; font-size:0.6rem; font-weight:700; padding:3px 8px; border-radius:999px; z-index:2; }
  .avail-badge.in{ background:rgba(124,224,160,0.18); color:var(--ok); border:1px solid rgba(124,224,160,0.4); }
  .avail-badge.out{ background:rgba(255,107,107,0.18); color:var(--error); border:1px solid rgba(255,107,107,0.4); }
  .dish-cat{ font-size:0.62rem; color:var(--amber); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
  .dish-card h4{ font-size:0.96rem; font-weight:600; margin:8px 0 10px; padding-right:44px; line-height:1.3; }
  .dish-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .rating{ display:flex; align-items:center; gap:4px; font-size:0.76rem; color:var(--star); }
  .price{ font-weight:700; font-size:0.94rem; }
  .no-results{ text-align:center; padding:60px 20px; color:var(--muted); }
  .no-results .btn-secondary{ margin-top:18px; display:inline-block; padding:12px 24px; border-radius:8px; background:var(--glass); border:1px solid var(--glass-border); }

  .skeleton{ animation: pulse 1.4s ease-in-out infinite; background:var(--glass-strong); }
  @keyframes pulse{ 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  /* ---------- Dish modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:150; opacity:0; pointer-events:none; transition:opacity .3s var(--ease); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-card{ width:100%; max-width:440px; background:var(--bg-2); border:1px solid var(--glass-border); border-radius:var(--radius); position:relative; transform:translateY(20px) scale(0.98); transition: transform .35s var(--ease); }
  .modal-overlay.open .modal-card{ transform:translateY(0) scale(1); }
  .modal-close{ position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); color:var(--text); font-size:1.1rem; cursor:pointer; z-index:2; }
  .modal-body{ padding:30px 28px; }
  .modal-body .dish-cat{ display:block; margin-bottom:8px; }
  .modal-body h2{ font-size:1.35rem; margin-bottom:10px; }
  .modal-body .desc{ color:var(--muted); font-size:0.92rem; font-weight:300; line-height:1.7; margin-bottom:18px; }
  .modal-meta-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .modal-price{ font-size:1.3rem; font-weight:700; }
  .qty-stepper{ display:flex; align-items:center; gap:14px; background:var(--glass); border:1px solid var(--glass-border); border-radius:999px; padding:8px 16px; }
  .qty-stepper button{ background:none; border:none; color:var(--text); font-size:1.1rem; width:22px; cursor:pointer; }
  .qty-stepper span{ min-width:20px; text-align:center; font-weight:600; }
  .btn-add-cart{ width:100%; padding:15px; border-radius:9px; border:none; cursor:pointer; background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a; font-weight:700; font-size:0.94rem; transition: transform .25s var(--ease), opacity .25s var(--ease); }
  .btn-add-cart:disabled{ opacity:0.45; cursor:not-allowed; background:var(--glass-strong); color:var(--muted); }
  .btn-add-cart:not(:disabled):hover{ transform:translateY(-2px); }

  /* ---------- Floating movable cart button ---------- */
  .cart-fab{
    position:fixed; z-index:120; width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a;
    display:flex; align-items:center; justify-content:center; cursor:grab;
    box-shadow:0 14px 30px -8px rgba(0,0,0,0.5); touch-action:none; user-select:none;
  }
  .cart-fab:active{ cursor:grabbing; }
  .cart-fab svg{ width:24px; height:24px; }
  .cart-fab .cart-badge{ position:absolute; top:-4px; right:-4px; background:var(--bg); color:var(--text); font-size:0.68rem; font-weight:700; min-width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--amber); padding:0 3px; }

  /* ---------- Cart bottom sheet (curved, stylish) ---------- */
  .cart-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(3px); z-index:130; opacity:0; pointer-events:none; transition:opacity .35s var(--ease); }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }
  .cart-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:140; max-height:82vh;
    background:var(--bg-2); border:1px solid var(--glass-border); border-top:1px solid var(--glass-border);
    border-radius:28px 28px 0 0; transform:translateY(100%); transition:transform .42s var(--ease);
    display:flex; flex-direction:column; box-shadow:0 -20px 60px -20px rgba(0,0,0,0.6);
  }
  .cart-sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:44px; height:5px; border-radius:99px; background:var(--glass-strong); margin:12px auto 4px; }
  .cart-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px 16px; border-bottom:1px solid var(--glass-border); }
  .cart-head h3{ font-size:1.1rem; }
  .cart-close{ background:none; border:none; color:var(--text); font-size:1.15rem; cursor:pointer; }
  .cart-items{ flex:1; overflow-y:auto; padding:14px 24px; }
  .cart-item{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--glass-border); align-items:center; }
  .cart-item-info{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .cart-item-info .name{ font-weight:600; font-size:0.9rem; }
  .cart-item-info .line{ display:flex; align-items:center; justify-content:space-between; }
  .cart-qty{ display:flex; align-items:center; gap:10px; }
  .cart-qty button{ background:var(--glass); border:1px solid var(--glass-border); color:var(--text); width:24px; height:24px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
  .cart-remove{ color:var(--error); font-size:0.76rem; background:none; border:none; cursor:pointer; }
  .cart-empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .cart-footer{ padding:16px 24px 22px; border-top:1px solid var(--glass-border); }
  .cart-total-row{ display:flex; justify-content:space-between; font-size:1rem; font-weight:700; margin-bottom:16px; }
  .btn-checkout{ width:100%; padding:15px; border-radius:999px; border:none; cursor:pointer; background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a; font-weight:700; font-size:0.94rem; transition: transform .25s var(--ease), opacity .25s var(--ease); }
  .btn-checkout:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-checkout:not(:disabled):hover{ transform:translateY(-2px); }

  /* ---------- Address modal ---------- */
  .addr-body{ padding:26px 26px 30px; }
  .addr-body h2{ font-size:1.25rem; margin-bottom:8px; }
  .addr-body p.hint{ color:var(--muted); font-size:0.85rem; font-weight:300; margin-bottom:20px; line-height:1.6; }
  .addr-field{ margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
  .addr-field label{ font-size:0.78rem; color:var(--muted); }
  .addr-field textarea, .addr-field input{
    background:rgba(255,255,255,0.03); border:1px solid var(--glass-border); border-radius:8px;
    padding:12px 14px; color:var(--text); font-size:0.9rem; resize:vertical;
  }
  .addr-field textarea:focus, .addr-field input:focus{ outline:none; border-color:var(--amber); }
  .btn-confirm-order{ width:100%; padding:15px; border-radius:9px; border:none; cursor:pointer; background:linear-gradient(135deg, var(--coral), var(--amber)); color:#1a0e0a; font-weight:700; font-size:0.94rem; }

  /* ---------- Bottom navigation ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:110;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(23,16,18,0.9); backdrop-filter:blur(16px); border-top:1px solid var(--glass-border);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:0.66rem; font-weight:600; background:none; border:none; cursor:pointer; padding:4px 10px; }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item.active{ color:var(--amber); }
  .nav-item img.nav-logo{ width:26px; height:26px; border-radius:50%; object-fit:cover; border:1px solid var(--glass-border); }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
    .marquee .track{ animation:none; }
  }
</style>
</head>
<body>

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="toast-stack" id="toastStack"></div>

<div class="marquee"><div class="track" id="marqueeTrack"></div></div>

<header>
  <span class="brand"><img src="Raffia.jpg" alt="Raffia Palm logo" onerror="this.style.display='none'"> Raffia Palm</span>
</header>

<div class="info-card-wrap">
  <div class="info-card classic-box">
    <div class="seg"><span class="label">Guest</span><span class="value" id="userNameDisplay">—</span></div>
    <div class="divider"></div>
    <div class="seg"><span class="label">Time</span><span class="value" id="liveClock">--:--:--</span></div>
  </div>
</div>

<div class="welcome-wrap" id="welcomeWrap">
  <h1 id="welcomeHeading">Welcome to the menu</h1>
  <p>Every cuisine, one table — browse, search, and build your order.</p>
</div>

<div class="search-wrap">
  <form class="search-form" id="menuSearchForm">
    <input type="text" id="menuSearchInput" placeholder="Search dishes…" aria-label="Search the menu">
    <button type="submit">Search</button>
  </form>
</div>

<div class="cat-scroll" id="catTabs"></div>

<main id="menuMain"></main>

<!-- Dish detail modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-body">
      <span class="dish-cat" id="modalCat"></span>
      <h2 id="modalName"></h2>
      <p class="desc" id="modalDesc"></p>
      <div class="modal-meta-row">
        <span class="modal-price" id="modalPrice"></span>
        <div class="qty-stepper">
          <button type="button" id="qtyMinus">−</button>
          <span id="qtyValue">1</span>
          <button type="button" id="qtyPlus">+</button>
        </div>
      </div>
      <button class="btn-add-cart" id="modalAddCart">Add to Cart</button>
    </div>
  </div>
</div>

<!-- Floating movable cart button -->
<button class="cart-fab" id="cartFab" aria-label="Open cart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 10.6a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg>
  <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
</button>

<!-- Cart bottom sheet -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-sheet" id="cartSheet">
  <div class="sheet-handle"></div>
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button class="cart-close" id="cartClose" aria-label="Close cart">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">₦0</span></div>
    <button class="btn-checkout" id="checkoutBtn" disabled>Proceed to Payment</button>
  </div>
</div>

<!-- Delivery address modal -->
<div class="modal-overlay" id="addrOverlay">
  <div class="modal-card">
    <button class="modal-close" id="addrClose" aria-label="Close">✕</button>
    <div class="addr-body">
      <h2>Delivery Details</h2>
      <p class="hint">We'll use this to deliver your order and to generate a tracking ID so you can follow it live once it's on the way.</p>
      <div class="addr-field">
        <label for="addrInput">Delivery address</label>
        <textarea id="addrInput" rows="3" placeholder="Street, area, city, landmark"></textarea>
      </div>
      <div class="addr-field">
        <label for="addrPhone">Contact phone</label>
        <input type="tel" id="addrPhone" placeholder="For the delivery rider to reach you">
      </div>
      <button class="btn-confirm-order" id="confirmOrderBtn">Confirm &amp; Continue to Payment</button>
    </div>
  </div>
</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <img class="nav-logo" src="Raffia.jpg" alt="Home" onerror="this.style.display='none'">
    Home
  </a>
  <button class="nav-item active" id="navMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3v18M5 3c3 0 3 3 3 4.5S5 12 5 12M12 3v18M19 3c-2 0-3 3-3 6s1 3 3 3v6"/></svg>
    Menu
  </button>
  <button class="nav-item" id="navTrack">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.3 7-11.5a7 7 0 1 0-14 0C5 14.7 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
    Track
  </button>
  <button class="nav-item" id="navAccount">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4.5-5 7-5s5.5 1.5 7 5"/></svg>
    Account
  </button>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCk8J-FExd7E5hOX8yVv7W0sIALleCrzD8",
    authDomain: "meridian-kitchen-d50f8.firebaseapp.com",
    projectId: "meridian-kitchen-d50f8",
    storageBucket: "meridian-kitchen-d50f8.firebasestorage.app",
    messagingSenderId: "757752916285",
    appId: "1:757752916285:web:31057acfed329c233bbd54"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function toast(message, kind = ''){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = message;
    stack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 2800);
  }

  /* ---------------- Auth guard ---------------- */
  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    if(!user){
      toast('Please log in to view the menu…');
      setTimeout(() => { window.location.href = 'login/auth.html'; }, 700);
      return;
    }
    currentUser = user;
    const name = user.displayName || user.email.split('@')[0];
    document.getElementById('userNameDisplay').textContent = name;
    document.getElementById('welcomeHeading').textContent = `Welcome back, ${name}`;
  });

  document.getElementById('navAccount').addEventListener('click', async () => {
    await signOut(auth);
    toast('Logged out — redirecting home…');
    setTimeout(() => { window.location.href = 'index.html'; }, 600);
  });
  document.getElementById('navTrack').addEventListener('click', () => {
    toast('Order tracking page is coming soon.');
  });

  /* ---------------- Live clock ---------------- */
  function tickClock(){
    document.getElementById('liveClock').textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------------- Welcome auto-hide (5s) ---------------- */
  setTimeout(() => { document.getElementById('welcomeWrap').classList.add('hide'); }, 5000);

  /* ---------------- Marquee ---------------- */
  (function renderMarquee(){
    const items = ["WELCOME TO RAFFIA PALM","FRESH FLAVOURS","PREMIUM DINING","BUILD YOUR ORDER BELOW","WE'RE HAPPY TO SERVE YOU"];
    const text = items.map(i => `<span>${i}</span>`).join("<span>•</span>");
    document.getElementById('marqueeTrack').innerHTML = text + text;
  })();

  /* ---------------- Categories ---------------- */
  const CATEGORIES = ["Rice & Grain","Grill & Fire","Seafood","Soups","Pasta","Garden & Salads","Snacks & Sides","Desserts","Drinks"];
  let activeCategory = "All";

  const catTabsEl = document.getElementById('catTabs');
  catTabsEl.innerHTML = ["All", ...CATEGORIES].map(c => `<button class="cat-chip${c==='All'?' active':''}" data-cat="${c}">${c}</button>`).join("");
  catTabsEl.querySelectorAll('.cat-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      catTabsEl.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('menuSearchInput').value = '';
      renderDishes();
    });
  });

  /* ---------------- Demo dish data (used until Firestore has real dishes) ---------------- */
  const DEMO_NAMES = {
    "Rice & Grain": ["Jollof Rice & Grilled Chicken","Fried Rice & Prawns","Coconut Rice & Beef","Ofada Rice & Ayamase","Basmati Pilaf & Lamb","Native Rice & Assorted Meat","Rice & Beans Special","Wild Rice & Mushroom","Spiced Rice & Turkey","Yam Porridge","Asaro (Yam Pottage)","Tuwo Shinkafa","Rice & Stewed Fish","Vegetable Fried Rice","Rice & Peppered Goat Meat"],
    "Grill & Fire": ["Charred Iberico & Blood Orange","Suya Skewers","Grilled Ribeye & Chimichurri","Smoked Turkey Wings","Grilled Tilapia","Peppered Grilled Chicken","BBQ Pork Ribs","Grilled Lamb Chops","Asun (Spicy Goat)","Grilled Corn & Butter","Charcoal Grilled Prawns","Grilled Beef Kebabs","Smoked Catfish","Grilled Quail","Firewood Chicken"],
    "Seafood": ["Citrus-Cured Kingfish","Grilled Salmon & Herb Butter","Prawn & Chorizo Skewers","Pepper Snapper","Crab Cakes","Calamari Fritti","Lobster Thermidor","Garlic Butter Shrimp","Seafood Okra","Banga Soup with Fish","Smoked Mackerel","Crayfish Stew","Grilled Prawns & Garlic","Fisherman's Platter","Coconut Fish Curry"],
    "Soups": ["Egusi Soup","Efo Riro","Pepper Soup (Catfish)","Ogbono Soup","Afang Soup","Edikang Ikong","Banga Soup","Oha Soup","Nsala Soup","Groundnut Soup","Okra Soup","Bitterleaf Soup","Vegetable Soup","Gbegiri Soup","Ewedu Soup"],
    "Pasta": ["Saffron Risotto & Scallop","Truffle Tagliatelle","Jollof Spaghetti","Creamy Garlic Penne","Beef Bolognese","Seafood Linguine","Mushroom Alfredo","Pesto Fusilli","Carbonara","Lasagna","Baked Mac & Cheese","Shrimp Scampi Pasta","Arrabbiata Penne","Spinach Ravioli","Lemon Butter Spaghetti"],
    "Garden & Salads": ["Grilled Halloumi Salad","Avocado & Citrus Salad","Roast Beet & Goat Cheese","Caesar Salad","Greek Salad","Garden Veg Salad","Quinoa & Kale Salad","Mango & Spinach Salad","Coleslaw","Waldorf Salad","Caprese Salad","Roasted Pumpkin Salad","Chickpea Salad","Grilled Chicken Salad","Cucumber & Feta Salad"],
    "Snacks & Sides": ["Plantain Chips","Peppered Snails","Spring Rolls","Sweet Potato Fries","Puff Puff","Meat Pie","Chicken Samosa","Yam Fries","Moimoi","Akara","Fried Plantain (Dodo)","Onion Rings","Garlic Bread","Suya Spiced Chips","Coconut Shrimp"],
    "Desserts": ["Dark Chocolate Tart","Chin Chin Parfait","Coconut Cheesecake","Red Velvet Cake","Vanilla Bean Panna Cotta","Banana Fritters","Caramel Bread Pudding","Tiramisu","Fruit Salad","Ice Cream Trio","Zobo Sorbet","Chocolate Lava Cake","Puff Pastry Mille-feuille","Coconut Macaroons","Lemon Meringue Tart"],
    "Drinks": ["Mango Passion Cooler","Zobo Spritz","Chapman","Ginger Fizz","Tigernut Milk","Watermelon Cooler","Hibiscus Iced Tea","Kunu Drink","Fresh Orange Juice","Pineapple Ginger Juice","Sparkling Water","Palm Wine Style Cooler","Iced Coffee","Smoothie Bowl Drink","Cucumber Mint Cooler"]
  };

  function makeFallback(){
    let items = [];
    let n = 1;
    Object.entries(DEMO_NAMES).forEach(([cat, names]) => {
      names.forEach((name) => {
        items.push({
          name, category:cat,
          price: 3500 + ((n * 650) % 16000),
          rating: (4 + (n % 10)/10),
          description: `A signature ${cat.toLowerCase()} dish at Raffia Palm, prepared fresh with quality ingredients and finished to order.`,
          available: true // admin panel will control this later
        });
        n++;
      });
    });
    return items;
  }

  let allDishes = [];

  async function loadDishes(){
    document.getElementById('menuMain').innerHTML = `<div class="dish-row"><div class="dish-card skeleton" style="height:150px"></div><div class="dish-card skeleton" style="height:150px"></div><div class="dish-card skeleton" style="height:150px"></div></div>`;
    try{
      const snap = await getDocs(collection(db, "dishes"));
      allDishes = snap.empty ? makeFallback() : snap.docs.map(d => ({ id:d.id, ...d.data() }));
    }catch(e){
      console.warn('dishes collection not available yet, using demo data', e);
      allDishes = makeFallback();
    }
    renderDishes();
  }

  const money = (n) => "₦" + Number(n).toLocaleString();
  const stars = (r) => "★".repeat(Math.round(r)) + "☆".repeat(5-Math.round(r));

  function dishCardHTML(d, globalIdx){
    return `
      <article class="dish-card" data-observe data-idx="${globalIdx}">
        <span class="avail-badge ${d.available ? 'in' : 'out'}">${d.available ? 'In Stock' : 'Sold Out'}</span>
        <span class="dish-cat">${d.category || ''}</span>
        <h4>${d.name}</h4>
        <div class="dish-meta">
          <span class="rating">${stars(d.rating||4.5)} <span style="color:var(--muted)">(${Number(d.rating||4.5).toFixed(1)})</span></span>
          <span class="price">${money(d.price||0)}</span>
        </div>
      </article>`;
  }

  function renderDishes(){
    const main = document.getElementById('menuMain');
    const q = document.getElementById('menuSearchInput').value.trim().toLowerCase();

    // Search overrides category view with a single flat row
    if(q){
      const matches = allDishes.filter(d => d.name.toLowerCase().includes(q) || (d.category||'').toLowerCase().includes(q));
      if(matches.length === 0){
        main.innerHTML = `
          <div class="no-results">
            <p>No dishes found for "${q}". Try another search or category.</p>
            <a href="#" class="btn-secondary" id="clearSearchBtn">Clear search</a>
          </div>`;
        document.getElementById('clearSearchBtn').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('menuSearchInput').value=''; renderDishes(); });
        return;
      }
      main.innerHTML = `
        <div class="cat-section">
          <div class="cat-section-head"><h3>Results for "${q}"</h3><span>${matches.length} dish${matches.length>1?'es':''}</span></div>
          <div class="dish-row-wrap"><div class="dish-row" id="row-search">${matches.map((d,i)=>dishCardHTML(d,i)).join('')}</div></div>
        </div>`;
      wireDishRow('row-search', matches);
      return;
    }

    const catsToShow = activeCategory === 'All' ? CATEGORIES : [activeCategory];
    main.innerHTML = catsToShow.map(cat => {
      const items = allDishes.filter(d => d.category === cat);
      if(items.length === 0) return '';
      const rowId = `row-${cat.replace(/[^a-z0-9]/gi,'')}`;
      return `
        <div class="cat-section">
          <div class="cat-section-head"><h3>${cat}</h3><span>${items.length} varieties</span></div>
          <div class="dish-row-wrap"><div class="dish-row" id="${rowId}">${items.map((d,i)=>dishCardHTML(d,i)).join('')}</div></div>
        </div>`;
    }).join("");

    catsToShow.forEach(cat => {
      const items = allDishes.filter(d => d.category === cat);
      if(items.length) wireDishRow(`row-${cat.replace(/[^a-z0-9]/gi,'')}`, items);
    });
  }

  function wireDishRow(rowId, items){
    const row = document.getElementById(rowId);
    if(!row) return;
    row.querySelectorAll('.dish-card').forEach(card => {
      card.addEventListener('click', () => openModal(items[Number(card.dataset.idx)]));
    });
    const io = new IntersectionObserver((entries)=>{
      entries.forEach((entry,i)=>{
        if(entry.isIntersecting){
          setTimeout(()=>entry.target.classList.add('in-view'), i*40);
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.1 });
    row.querySelectorAll('[data-observe]').forEach(c => io.observe(c));
  }

  /* ---------------- Search ---------------- */
  document.getElementById('menuSearchForm').addEventListener('submit', (e) => { e.preventDefault(); renderDishes(); });
  document.getElementById('menuSearchInput').addEventListener('input', () => renderDishes());

  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('search')) document.getElementById('menuSearchInput').value = urlParams.get('search');
  if(urlParams.get('category')){
    const catParam = urlParams.get('category');
    const match = ['All', ...CATEGORIES].find(c => c.toLowerCase() === catParam.toLowerCase());
    if(match){
      activeCategory = match;
      catTabsEl.querySelectorAll('.cat-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === match));
    }
  }

  /* ---------------- Dish detail modal ---------------- */
  let currentDish = null;
  let currentQty = 1;
  const modalOverlay = document.getElementById('modalOverlay');

  function openModal(dish){
    currentDish = dish;
    currentQty = 1;
    document.getElementById('modalCat').textContent = dish.category || '';
    document.getElementById('modalName').textContent = dish.name;
    document.getElementById('modalDesc').textContent = dish.description || 'A signature Raffia Palm dish, prepared fresh to order.';
    document.getElementById('modalPrice').textContent = money(dish.price || 0);
    document.getElementById('qtyValue').textContent = currentQty;
    const addBtn = document.getElementById('modalAddCart');
    addBtn.disabled = !dish.available;
    addBtn.textContent = dish.available ? 'Add to Cart' : 'Currently Sold Out';
    modalOverlay.classList.add('open');
  }
  function closeModal(){ modalOverlay.classList.remove('open'); }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
  document.getElementById('qtyMinus').addEventListener('click', () => { if(currentQty>1){ currentQty--; document.getElementById('qtyValue').textContent = currentQty; } });
  document.getElementById('qtyPlus').addEventListener('click', () => { currentQty++; document.getElementById('qtyValue').textContent = currentQty; });

  document.getElementById('modalAddCart').addEventListener('click', () => {
    if(!currentDish || !currentDish.available) return;
    addToCart(currentDish, currentQty);
    toast(`Added ${currentQty} × ${currentDish.name} to cart`, 'ok');
    closeModal();
  });

  /* ---------------- Cart (persisted in localStorage) ---------------- */
  const CART_KEY = 'raffia_cart';
  function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }catch(e){ return []; } }
  function saveCart(cart){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); renderCart(); }

  function addToCart(dish, qty){
    const cart = getCart();
    const existing = cart.find(i => i.name === dish.name);
    if(existing) existing.qty += qty;
    else cart.push({ name:dish.name, price:dish.price, category:dish.category, qty });
    saveCart(cart);
  }
  function updateQty(name, delta){
    const cart = getCart();
    const item = cart.find(i => i.name === name);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0){ removeFromCart(name); return; }
    saveCart(cart);
  }
  function removeFromCart(name){
    saveCart(getCart().filter(i => i.name !== name));
    toast('Removed from cart');
  }

  function renderCart(){
    const cart = getCart();
    const itemsEl = document.getElementById('cartItems');
    const badge = document.getElementById('cartBadge');
    const totalEl = document.getElementById('cartTotal');
    const checkoutBtn = document.getElementById('checkoutBtn');

    const totalQty = cart.reduce((s,i) => s + i.qty, 0);
    if(totalQty > 0){ badge.style.display='flex'; badge.textContent = totalQty; } else { badge.style.display='none'; }

    if(cart.length === 0){
      itemsEl.innerHTML = `<div class="cart-empty">Your cart is empty.<br>Browse the menu and add a dish to get started.</div>`;
      totalEl.textContent = money(0);
      checkoutBtn.disabled = true;
      return;
    }

    itemsEl.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-info">
          <span class="name">${item.name}</span>
          <span style="color:var(--muted); font-size:0.78rem;">${money(item.price)} each · ${item.category||''}</span>
          <div class="line">
            <div class="cart-qty">
              <button data-qty-minus="${item.name}">−</button>
              <span>${item.qty}</span>
              <button data-qty-plus="${item.name}">+</button>
            </div>
            <button class="cart-remove" data-remove="${item.name}">Remove</button>
          </div>
        </div>
      </div>`).join("");

    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    totalEl.textContent = money(total);
    checkoutBtn.disabled = false;

    itemsEl.querySelectorAll('[data-qty-minus]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyMinus, -1)));
    itemsEl.querySelectorAll('[data-qty-plus]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.qtyPlus, 1)));
    itemsEl.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => removeFromCart(b.dataset.remove)));
  }

  /* ---------------- Cart sheet open/close ---------------- */
  const cartSheet = document.getElementById('cartSheet');
  const cartOverlay = document.getElementById('cartOverlay');
  function openCart(){ cartSheet.classList.add('open'); cartOverlay.classList.add('open'); }
  function closeCart(){ cartSheet.classList.remove('open'); cartOverlay.classList.remove('open'); }
  document.getElementById('cartFab').addEventListener('click', (e) => { if(!fabDragged) openCart(); });
  document.getElementById('cartClose').addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', closeCart);

  /* ---------------- Draggable cart FAB ---------------- */
  const fab = document.getElementById('cartFab');
  let fabDragged = false;
  (function makeDraggable(){
    let dragging = false, offsetX=0, offsetY=0, startX=0, startY=0;
    fab.style.right = '20px';
    fab.style.bottom = '96px';

    function start(x,y){
      dragging = true; fabDragged = false;
      startX = x; startY = y;
      const rect = fab.getBoundingClientRect();
      offsetX = x - rect.left; offsetY = y - rect.top;
      fab.style.left = rect.left + 'px'; fab.style.top = rect.top + 'px';
      fab.style.right = 'auto'; fab.style.bottom = 'auto';
    }
    function move(x,y){
      if(!dragging) return;
      if(Math.abs(x-startX) > 6 || Math.abs(y-startY) > 6) fabDragged = true;
      let left = x - offsetX, top = y - offsetY;
      left = Math.max(6, Math.min(window.innerWidth - fab.offsetWidth - 6, left));
      top = Math.max(6, Math.min(window.innerHeight - fab.offsetHeight - 6, top));
      fab.style.left = left + 'px'; fab.style.top = top + 'px';
    }
    function end(){ dragging = false; setTimeout(()=>{ fabDragged=false; }, 50); }

    fab.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
    window.addEventListener('mouseup', end);

    fab.addEventListener('touchstart', (e) => { const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
    window.addEventListener('touchmove', (e) => { const t=e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
    window.addEventListener('touchend', end);
  })();

  /* ---------------- Checkout -> address -> tracking ID -> payment ---------------- */
  const addrOverlay = document.getElementById('addrOverlay');
  document.getElementById('checkoutBtn').addEventListener('click', () => {
    if(getCart().length === 0) return;
    closeCart();
    addrOverlay.classList.add('open');
  });
  document.getElementById('addrClose').addEventListener('click', () => addrOverlay.classList.remove('open'));
  addrOverlay.addEventListener('click', (e) => { if(e.target === addrOverlay) addrOverlay.classList.remove('open'); });

  function generateTrackingId(){
    return 'RP-' + Math.random().toString(36).slice(2,8).toUpperCase();
  }

  document.getElementById('confirmOrderBtn').addEventListener('click', async () => {
    const address = document.getElementById('addrInput').value.trim();
    const phone = document.getElementById('addrPhone').value.trim();
    if(!address){ toast('Please enter a delivery address.', 'err'); return; }
    if(!phone){ toast('Please enter a contact phone number.', 'err'); return; }

    const cart = getCart();
    const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const trackingId = generateTrackingId();

    const order = { items:cart, total, address, phone, trackingId, createdAt:Date.now() };
    localStorage.setItem('raffia_last_order', JSON.stringify(order));

    try{
      await addDoc(collection(db, 'orders'), {
        userId: currentUser ? currentUser.uid : null,
        items: cart, total, address, phone, trackingId,
        status: 'placed',
        createdAt: serverTimestamp()
      });
    }catch(e){ console.warn('Could not save order to Firestore yet', e); }

    toast(`Order confirmed! Tracking ID: ${trackingId} — redirecting to payment…`, 'ok');
    addrOverlay.classList.remove('open');
    setTimeout(() => { window.location.href = `payment.html?tracking=${trackingId}`; }, 1000);
  });

  /* ---------------- Init ---------------- */
  loadDishes();
  renderCart();
</script>

</body>
